version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vulcantech_backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=VulcanTech Smart Metals S.A. — API Industrial
      - APP_VERSION=1.0.0
      - API_PREFIX=/api/v1
      - DATABASE_URL=sqlite:///./database/vulcantech.db
      - LOG_LEVEL=INFO
    volumes:
      - ./database:/app/database
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vulcantech_frontend
    command: streamlit run frontend/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    volumes:
      - ./database:/app/database
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

